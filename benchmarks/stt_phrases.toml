# STT benchmark phrases for scripts/bench_stt.py (Issue #87).
#
# Fields:
#   id        unique id (also the WAV file name)
#   lang      ru | en | mixed ("mixed" = Russian sentence with an English name; expected language ru)
#   category  app | site | search | chat | number | silence
#   text      the reference transcript, also what is synthesized or read aloud with --record.
#             Empty text (category "silence") = a clip with no speech: the expected result is
#             an empty transcript. Numbers are written as digits, the way Whisper prints them.

