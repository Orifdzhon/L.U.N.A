# Wake-word benchmark phrases for scripts/bench_wake.py (Issue #112, ADR 0004 decision D7).
#
# Fields:
#   id        unique id (also the WAV file name)
#   label     positive = the assistant must wake up; negative = it must stay quiet
#   category  wake            the bare keyword
#             one-breath      keyword and command in one breath ("Луна, открой ютуб")
#             en              English phrase (Russian-only model; excluded by default, --skip-categories)
#             contains        a sentence that contains the keyword as a noun (negative)
#             near-homophone  a different word that sounds close to the keyword (negative)
#             speech          ordinary speech without the keyword (negative)
#   lang      ru | en (selects the TTS voice)
#   text      what is synthesized (--synth) or read aloud (--record)
#
# Decisions on the borderline cases:
#   - "Луна-парк", "луна на небе", "лунный свет" are NEGATIVE. The keyword counts only as an
#     address to the assistant (at the start of an utterance, as a name); a noun inside a sentence
#     must not wake it, even though the engine hears the same word.
#   - "Луначарский", "лунный", "лун" are near-homophones; "она", "Лена", "Лина", "Лана" are the
#     acoustically closest ordinary words. All NEGATIVE.
#   - "Луна" alone and "Луна, <command>" are POSITIVE (the command part must not break detection).

# -- positives ---------------------------------------------------------------------------------

[[phrase]]
id = "wake-1"
label = "positive"
category = "wake"
lang = "ru"
text = "Луна"

