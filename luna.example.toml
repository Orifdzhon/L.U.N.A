# L.U.N.A. example configuration.
#
# Copy to %APPDATA%\LUNA\luna.toml (or ./luna.toml, or pass --config PATH) and edit.
# Every key below is optional: the values shown are the defaults. Your values are merged
# over the defaults, so you only need to write what you change.
#
# API keys do NOT go here. Put them in a gitignored `.env` file (see .env.example) or in
# environment variables: GEMINI_API_KEY, GROQ_API_KEY, TAVILY_API_KEY.

[app]
log_level = "INFO"          # DEBUG | INFO | WARNING | ERROR | CRITICAL
history_turns = 6           # dialogue turns kept as LLM context (>= 0)
request_timeout_s = 20.0    # overall limit for one user request, seconds (> 0)

[llm]
# Providers are tried in this order; a provider whose key is missing is skipped.
chain = ["groq", "gemini", "local"]
timeout_s = 20.0            # per-request read timeout, seconds (> 0)
connect_timeout_s = 5.0     # connection timeout, seconds (> 0)

[llm.providers.gemini]
base_url = "https://generativelanguage.googleapis.com/v1beta/openai/"
model = "gemini-3.5-flash-lite"
api_key_env = "GEMINI_API_KEY"   # name of the environment variable holding the key
# Optional per-provider quirks:
# supports_tool_choice = true
# reasoning_effort = "low"
# max_tokens = 1024

[llm.providers.groq]
base_url = "https://api.groq.com/openai/v1"
model = "openai/gpt-oss-120b"
api_key_env = "GROQ_API_KEY"
reasoning_effort = "low"    # low | medium | high; "low" keeps voice replies fast

# Local fallback: LM Studio (Developer -> Start Server). For Ollama use
# base_url = "http://localhost:11434/v1". No key needed.
[llm.providers.local]
base_url = "http://localhost:1234/v1"
# Set `model` to the exact identifier of the model you loaded, as shown by LM Studio
# (e.g. "qwen3.5-9b-uncensored-hauhaucs-aggressive@q4_k_m"); the default is only a placeholder.
model = "qwen3-4b"

[search]
provider = "ddgs"           # ddgs | searxng | tavily
max_results = 5             # >= 1
fetch_pages = 3             # result pages to download and read, >= 0
# searxng_url = "http://localhost:8080"   # required when provider = "searxng"
# api_key_env = "TAVILY_API_KEY"          # key variable for provider = "tavily"

[router]
threshold = 85              # fuzzy match score 0..100 needed to open an app/site
margin = 5                  # the best match must beat the runner-up by this much
# Your own aliases (spoken name -> app name / URL), merged with the shipped ones:
# [router.app_aliases]
# "блокнот" = "notepad"
# [router.site_aliases]
# "ютуб" = "https://www.youtube.com"

[tts]
enabled = false             # speak replies aloud; `luna --voice` / `--no-voice` override this
provider = "piper"          # "piper": local neural voice (Irina / Kristin), nothing leaves the PC,
                            # falls back to SAPI; "edge": Microsoft neural voices online (text is
                            # sent to Microsoft), falls back to local Irina, then SAPI;
                            # "sapi": Windows voices only
edge_voice_ru = "ru-RU-SvetlanaNeural"  # Edge voices; list: `uv run edge-tts --list-voices`
edge_voice_en = "en-US-JennyNeural"
voice_ru = "Irina"          # SAPI voice (fallback): substring of an installed name
voice_en = "Zira"           # e.g. "Microsoft Zira Desktop"
rate = 0                    # speech speed, -10 (slow) .. 10 (fast); Edge: 5 % per step
volume = 100                # 0..100
edge_timeout_s = 15         # upper bound for one online chunk (scaled to its length; > 0)
fallback_cooldown_s = 15    # skip Edge this long after 2 failed chunks in a row (>= 0)
max_chars = 1500            # longest spoken reply; longer ones are cut at a sentence end (>= 1)
first_chunk_max_chars = 200 # size limit of the first spoken chunk, for a quick start (>= 1)

[tts.edge]                  # provider = "edge"
first_audio_s = 2.5         # no audio after this long: Edge is stalled, Irina speaks (> 0)

[tts.piper]                 # provider = "piper" (and the fallback of "edge"): voices are downloaded on first use (~65 MB each)
voice_ru = "ru_RU-irina-medium"
voice_en = "en_US-kristin-medium"
# model_dir = 'C:\Users\you\AppData\Local\LUNA\models'   # default: %LOCALAPPDATA%\LUNA\models
num_threads = 2             # CPU threads for synthesis (1..16)

[stt]
# Engines are tried in this order; "groq" is skipped when GROQ_API_KEY is missing.
chain = ["groq", "local"]     # groq | local, no duplicates, not empty
language = "ru"               # language of your speech: ru | en | any ISO code | auto (detect)
prompt = ""                   # optional bias text with app / brand names (<= 500 chars)
timeout_s = 5.0               # per-engine limit, seconds (> 0)
# Old keys provider / model / device / compute_type are ignored with a warning.

[stt.groq]
model = "whisper-large-v3-turbo"
api_key_env = "GROQ_API_KEY"  # name of the environment variable holding the key

[stt.local]                   # faster-whisper on this machine
model = "base"                # base: ~1 s per phrase on a laptop CPU; small is ~2x slower
device = "cpu"                # cpu | cuda | auto
compute_type = "int8"
beam_size = 1
# model_dir = "C:/Users/you/AppData/Local/LUNA/models"   # default: %LOCALAPPDATA%\LUNA\models

[voice]
listen = false                # true: the microphone may be opened (push-to-talk hotkey)
hotkey = "ctrl+alt+space"     # lowercase names joined by "+": >= 1 modifier, exactly 1 key
start_beep = false            # short beep when listening starts
# input_device = 1            # microphone index or part of its name; default: system default
frame_ms = 30                 # audio frame size: 10 | 20 | 30
vad_energy_threshold = 0.003  # minimum RMS level (0..1) counted as speech; calibrate with /mic
vad_noise_margin = 3.0        # speech must exceed the noise floor by this factor (>= 1)
silence_ms = 700              # silence that ends the phrase (> 0)
min_speech_ms = 200           # shorter sounds are ignored (> 0)
preroll_ms = 300              # audio kept from before speech was detected (>= 0)
max_utterance_s = 10          # hard stop of one recording, seconds (0..60]

# Wake word. Off by default: the microphone is opened only with enabled = true, --wake or /wake.
# The old `hotkey` key here is ignored (with a warning); use [voice] hotkey.
[wakeword]
enabled = false
engine = "vosk"               # "vosk" | "off"
keywords = ["луна"]
threshold = 0.5               # detector confidence 0..1
cooldown_s = 2.0              # ignore repeated triggers for this long
model = "small-ru"
# model_dir = 'C:\Users\you\AppData\Local\LUNA\models'   # default: same models folder as STT
mute_while_speaking = true    # do not listen while L.U.N.A. speaks
speaking_tail_ms = 400        # extra mute after speech ends
command_timeout_s = 5.0       # wait for a command after the keyword
cue = "off"                   # "off" | "beep" when the keyword is heard
follow_up_s = 0.0             # 0 = off. Conversation mode: after a reply keep listening for the next
                              # command without "Луна" for this many seconds; every command restarts
                              # the window (try 90, max 300). Say "спасибо" / "стоп" / "отбой" to end it.
                              # While it is open any speech goes to the STT provider (Groq) like a hotkey turn.
mode = "free"                 # "free" | "grammar": free = no grammar, "луна" must be a whole recognised
                              # word (rejects "Лена", "лунный"); grammar = more false triggers
verify = "off"                # "off" | "local": second-stage check of each detection with the
                              # [stt.local] faster-whisper model. Off by default: whisper "base"
                              # mishears a quiet "Луна" (3 of 7 rejected) and free mode already
                              # rejects homophones. "local" = slower check, may reject real wakes
verify_words = ["луна", "луну", "луне", "луны", "luna"]   # the transcript must START with one
                              # of these (Latin lookalike letters in a Russian word are fixed)
log_rejects = false           # true: write what the check heard in REJECTED wakes to the local
                              # log (INFO). Stays on this PC, but may contain speech that was not
                              # meant for L.U.N.A. - enable only to debug missed wakes

# Desktop shell (tray + window). "Start with Windows" is toggled from the tray menu;
# the old `autostart` key here is ignored (with a warning if it was true).
[ui]
start_minimized = false       # start hidden in the tray
notifications = true          # tray notifications
history_lines = 200           # lines kept in the window history (20..2000)
