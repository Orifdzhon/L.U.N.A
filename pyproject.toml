[project]
name = "luna"
version = "0.1.0"
description = "L.U.N.A. - voice assistant for Windows"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "ddgs>=9.16,<10",
    "httpx>=0.27",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.14.6",
    "trafilatura>=2.0",
]

[project.optional-dependencies]
# Declared now, populated by later Issues (voice: STT/TTS/wake word; ui: PySide6).
voice = []
ui = []

[project.scripts]
luna = "luna.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "respx>=0.21",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luna"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Ruff 0.17 also formats Python snippets inside Markdown; the docs are hand-written sketches.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
pythonpath = ["tests"]
markers = [
    "live: needs real network / API keys (run manually)",
    "gpu: needs a CUDA GPU",
    "audio: needs a microphone or speakers",
]
addopts = '-m "not live and not gpu and not audio"'
