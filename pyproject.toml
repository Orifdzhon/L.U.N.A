[project]
name = "luna"
version = "0.1.0"
description = "L.U.N.A. - voice assistant for Windows"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "ddgs>=9.16,<10",
    "edge-tts>=7,<8",
    "faster-whisper>=1.1,<2",
    "httpx>=0.27",
    "miniaudio>=1.61,<2",
    "openai>=2,<3",
    "pydantic>=2.9",
    "pyside6-essentials>=6.12,<7",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.14.6",
    "sounddevice>=0.5; sys_platform == 'win32'",
    "trafilatura>=2.0",
    "vosk>=0.3.45,<0.4 ; sys_platform == 'linux' or sys_platform == 'win32'",
]

[project.optional-dependencies]
# Declared now, populated by later Issues (STT/wake word; ui: PySide6).
# sounddevice (voice output) is a core Windows dependency: a plain `uv run` re-syncs without
# extras and would uninstall it.
ui = []

[project.scripts]
luna = "luna.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "respx>=0.21",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luna"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Ruff 0.17 also formats Python snippets inside Markdown; the docs are hand-written sketches.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
pythonpath = ["tests", "scripts"]
markers = [
    "live: needs real network / API keys (run manually)",
    "gpu: needs a CUDA GPU",
    "audio: needs a microphone or speakers",
    "desktop: touches the real Windows desktop session (global hotkeys)",
]
addopts = '-m "not live and not gpu and not audio and not desktop"'
